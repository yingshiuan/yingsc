name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Run lint, type check, tests and the build on every pull request into `main`,
  # so problems show up before merging. Only a push to `main` deploys.
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Read-only by default. Only the deploy job gets Pages write access, so a pull
# request run can never publish the site.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
# Runs on `main` are never cancelled; the deploy job below also queues
# deploys one at a time so Pages isn't left half-updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # keep in sync with withastro/action's default
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check (astro check)
        run: npm run check

  # Playwright + axe over the built site: theme-flash timing, keyboard focus, and
  # a WCAG AA sweep of every page in both colour schemes.
  # A failing suite turns this job red — the run should say so — but it is
  # deliberately absent from `deploy.needs`, so the site still ships. A new
  # suite over a site that wasn't built to be accessible ratchets rather than
  # gates. To make accessibility a release gate, add `a11y` to `deploy.needs`.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # keep in sync with withastro/action's default
          cache: npm
      - run: npm ci
      # --with-deps pulls the shared libraries headless Chromium needs on the
      # runner; the browser binary itself is not in node_modules.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility and behaviour tests
        run: npm test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)
          # build-cmd: pnpm run build # The command to run to build your site. Runs the package build script/task by default. (optional)
        # env:
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2' # Use single quotation marks for the variable value. (optional)

  deploy:
    # Gate on both: quality and build run concurrently, deploy waits for each.
    needs: [quality, build]
    # Pull requests stop after the checks and the build; only `main` deploys.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5